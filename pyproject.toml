[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skillcraft-hybrid-rag-pipeline"
version = "0.1.0"
description = "Hybrid BM25 and dense retrieval RAG pipeline with source citations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pypdf>=5.0.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
rag-pipeline = "rag_pipeline.cli:app"

[tool.setuptools.packages.find]
include = ["rag_pipeline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
